<svg xmlns="http://www.w3.org/2000/svg" width="850" height="600" viewBox="0 0 850 600">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#faf5ed"/>
      <stop offset="100%" stop-color="#f4ebe1"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="certPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#b45309" opacity="0.15"/>
    </pattern>
    <filter id="certShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Document Sheet -->
  <rect x="20" y="20" width="810" height="560" rx="8" fill="url(#parchment)" filter="url(#certShadow)"/>
  <rect x="20" y="20" width="810" height="560" rx="8" fill="url(#certPattern)"/>

  <!-- Ornamental Outer Border -->
  <rect x="36" y="36" width="778" height="528" rx="6" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="44" y="44" width="762" height="512" rx="4" fill="none" stroke="#0f766e" stroke-width="1.5"/>

  <!-- Corner Flourishes -->
  <g stroke="#b45309" stroke-width="2" fill="none">
    <path d="M 50 70 L 70 50 M 50 60 L 60 50"/>
    <path d="M 800 70 L 780 50 M 800 60 L 790 50"/>
    <path d="M 50 530 L 70 550 M 50 540 L 60 550"/>
    <path d="M 800 530 L 780 550 M 800 540 L 790 550"/>
  </g>

  <!-- Government Header -->
  <g transform="translate(425, 75)" text-anchor="middle">
    <!-- DOT Official Seal Graphic -->
    <circle cx="0" cy="18" r="28" fill="#0f766e"/>
    <circle cx="0" cy="18" r="24" fill="#ffffff"/>
    <circle cx="0" cy="18" r="22" fill="#042f2e"/>
    <path d="M 0 4 L 4 14 L 14 14 L 6 20 L 9 30 L 0 24 L -9 30 L -6 20 L -14 14 L -4 14 Z" fill="#fbbf24"/>

    <text x="0" y="65" font-family="'Plus Jakarta Sans', Segoe UI, serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="2">REPUBLIC OF THE PHILIPPINES</text>
    <text x="0" y="84" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#0f766e" letter-spacing="1.5">DEPARTMENT OF TOURISM</text>
    <text x="0" y="100" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#64748b">REGION VII · CENTRAL VISAYAS REGIONAL OFFICE</text>

    <!-- Certificate Title -->
    <text x="0" y="142" font-family="'Georgia', serif" font-size="28" font-weight="700" fill="#0f172a" letter-spacing="1">Certificate of Accreditation</text>
    <line x1="-160" y1="154" x2="160" y2="154" stroke="url(#goldBorder)" stroke-width="2"/>
    <text x="0" y="172" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1">ACCREDITATION NO. DOT-R07-TG-2026-0842</text>

    <!-- Preamble -->
    <text x="0" y="205" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="13" font-style="italic" fill="#475569">This is to officially certify that</text>

    <!-- Recipient Name -->
    <text x="0" y="246" font-family="'Georgia', serif" font-size="30" font-weight="700" fill="#0f766e" letter-spacing="1">MARC REPUESTO</text>
    <line x1="-180" y1="258" x2="180" y2="258" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Certification Body -->
    <text x="0" y="290" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="13" fill="#334155">has satisfactorily complied with the prescribed standards and qualification requirements</text>
    <text x="0" y="310" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="13" fill="#334155">promulgated pursuant to Republic Act No. 9593 (The Tourism Act of 2009) and is hereby granted accreditation as an</text>
    <text x="0" y="336" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#0f172a">OFFICIAL REGIONAL TOUR GUIDE</text>
    <text x="0" y="358" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0d9488">Authorized Area: Moalboal, Badian, and South Cebu Tourism Corridors</text>
  </g>

  <!-- Lower Section: Validity, Seal & Signatures -->
  <g transform="translate(80, 470)">
    <!-- Left: Issue & Expiry info -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b">DATE ISSUED:</text>
    <text x="80" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e293b">September 21, 2026</text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b">VALID UNTIL:</text>
    <text x="80" y="22" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f766e">September 21, 2029</text>

    <!-- Center: Gold Foil Seal -->
    <g transform="translate(345, 0)">
      <circle cx="0" cy="5" r="38" fill="url(#goldBorder)"/>
      <circle cx="0" cy="5" r="32" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
      <text x="0" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="7" font-weight="800" fill="#78350f" letter-spacing="1">DEPT OF TOURISM</text>
      <text x="0" y="7" text-anchor="middle" font-family="'Georgia', serif" font-size="14" font-weight="800" fill="#b45309">SEAL</text>
      <text x="0" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="7" font-weight="800" fill="#78350f" letter-spacing="1">OFFICIAL · REGION 7</text>
    </g>

    <!-- Right: Signature of Regional Director -->
    <g transform="translate(530, 0)">
      <path d="M 0 0 C 25 -15, 45 20, 70 -5 C 90 -20, 110 15, 140 0" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round"/>
      <line x1="-10" y1="12" x2="160" y2="12" stroke="#64748b" stroke-width="1"/>
      <text x="75" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#0f172a">GELENA N. ASUNCION</text>
      <text x="75" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#64748b">Regional Director, DOT Region VII</text>
    </g>
  </g>
</svg>
