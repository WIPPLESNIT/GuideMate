<svg xmlns="http://www.w3.org/2000/svg" width="850" height="540" viewBox="0 0 850 540">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="guilloche" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 Q 7.5 0, 15 15 T 30 15" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12"/>
      <path d="M 15 0 Q 22.5 15, 30 0 T 45 0" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Drop Shadow & Card Body -->
  <rect x="20" y="20" width="810" height="500" rx="20" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="810" height="500" rx="20" fill="url(#guilloche)"/>

  <!-- Top Header Banner -->
  <rect x="20" y="20" width="810" height="96" rx="20" fill="#042f2e" fill-opacity="0.6"/>
  <circle cx="70" cy="68" r="28" fill="url(#goldGrad)"/>
  <!-- Sun & Stars Emblem -->
  <circle cx="70" cy="68" r="14" fill="#ffffff" opacity="0.9"/>
  <path d="M 70 46 L 73 60 L 87 60 L 76 68 L 80 82 L 70 74 L 60 82 L 64 68 L 53 60 L 67 60 Z" fill="#ca8a04"/>

  <text x="115" y="52" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ccfbf1" letter-spacing="1.5">REPUBLIC OF THE PHILIPPINES · DEPARTMENT OF TOURISM</text>
  <text x="115" y="74" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">ACCREDITED TOUR GUIDE IDENTIFICATION CARD</text>
  <text x="115" y="94" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#99f6e4">REGION VII · CENTRAL VISAYAS (CEBU)</text>

  <!-- Card Main Content Area -->
  <rect x="42" y="132" width="766" height="364" rx="14" fill="#ffffff"/>

  <!-- Left: Photo & Chip -->
  <g transform="translate(64, 154)">
    <!-- Photo Box -->
    <rect x="0" y="0" width="168" height="210" rx="10" fill="url(#photoGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Guide Avatar Graphic -->
    <circle cx="84" cy="74" r="38" fill="#94a3b8"/>
    <circle cx="84" cy="64" r="28" fill="#e2e8f0"/>
    <path d="M 28 178 C 28 128, 140 128, 140 178 Z" fill="#94a3b8"/>
    <path d="M 40 178 C 40 138, 128 138, 128 178 Z" fill="#0d9488"/>

    <!-- Smart Chip -->
    <rect x="180" y="24" width="46" height="38" rx="6" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1.5"/>
    <line x1="180" y1="43" x2="226" y2="43" stroke="#78350f" stroke-width="1.5"/>
    <line x1="203" y1="24" x2="203" y2="62" stroke="#78350f" stroke-width="1.5"/>

    <!-- ID Status Badge under Photo -->
    <rect x="0" y="222" width="168" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="84" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#047857">DOT ACCREDITED</text>
  </g>

  <!-- Right: Guide Personal Details -->
  <g transform="translate(300, 158)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">FULL NAME / PANGALAN</text>
    <text x="0" y="48" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#0f172a">MARC REPUESTO</text>

    <text x="0" y="90" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">ACCREDITATION NUMBER</text>
    <text x="0" y="114" font-family="'Plus Jakarta Sans', Courier, monospace" font-size="17" font-weight="800" fill="#0f766e">DOT-R07-TG-2026-0842</text>

    <g transform="translate(0, 140)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CLASSIFICATION</text>
      <text x="0" y="22" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Regional Tour Guide</text>

      <text x="220" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">SPECIALIZATION</text>
      <text x="220" y="22" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Eco-Tourism &amp; Marine</text>
    </g>

    <g transform="translate(0, 196)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">ISSUED DATE</text>
      <text x="0" y="20" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#334155">Sept 21, 2026</text>

      <text x="140" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">VALID UNTIL</text>
      <text x="140" y="20" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Sept 21, 2029</text>

      <text x="280" y="0" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">AREA OF OPERATION</text>
      <text x="280" y="20" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#334155">Moalboal, Cebu</text>
    </g>

    <!-- Barcode & Security Strip -->
    <g transform="translate(0, 252)">
      <!-- Barcode lines -->
      <rect x="0" y="0" width="3" height="42" fill="#0f172a"/>
      <rect x="5" y="0" width="2" height="42" fill="#0f172a"/>
      <rect x="9" y="0" width="5" height="42" fill="#0f172a"/>
      <rect x="16" y="0" width="2" height="42" fill="#0f172a"/>
      <rect x="20" y="0" width="4" height="42" fill="#0f172a"/>
