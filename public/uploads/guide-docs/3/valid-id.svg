      <rect x="194" y="0" width="2" height="42" fill="#0f172a"/>
      <rect x="198" y="0" width="5" height="42" fill="#0f172a"/>
      <text x="0" y="58" font-family="Courier, monospace" font-size="11" fill="#64748b">||| 9820-4109-8427-0192 |||</text>

      <!-- Signature Placeholder -->
      <g transform="translate(260, 10)">
        <path d="M 10 22 C 30 5, 50 35, 75 12 C 95 -5, 115 28, 140 15 C 155 8, 170 20, 185 10" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="36" x2="200" y2="36" stroke="#94a3b8" stroke-width="1"/>
        <text x="100" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', Segoe UI, sans-serif" font-size="10" fill="#64748b">BEARER'S SIGNATURE</text>
      </g>
    </g>
  </g>
</svg>
