      <rect x="119" y="0" width="6" height="42" fill="#0f172a"/>
      <rect x="127" y="0" width="2" height="42" fill="#0f172a"/>
      <rect x="131" y="0" width="4" height="42" fill="#0f172a"/>
      <rect x="137" y="0" width="3" height="42" fill="#0f172a"/>
      <rect x="142" y="0" width="5" height="42" fill="#0f172a"/>
      <rect x="149" y="0" width="2" height="42" fill="#0f172a"/>
      <rect x="153" y="0" width="4" height="42" fill="#0f172a"/>
      <rect x="159" y="0" width="3" height="42" fill="#0f172a"/>
      <rect x="164" y="0" width="6" height="42" fill="#0f172a"/>
      <rect x="172" y="0" width="2" height="42" fill="#0f172a"/>
